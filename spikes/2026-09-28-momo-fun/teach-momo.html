<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teach Momo</title>
<style>
/* ---- Shared look (same in all three spikes) ---- */
:root{
  --cream:#FFF7E8; --mint:#BFE8D8; --mint-deep:#3FA88A; --coral:#FF7B6B; --ink:#2D3436;
  --white:#FFFFFF; --mint-shadow:#2C7A64; --coral-shadow:#C95A4C; --error:#B3473A;
  --coral-soft:#FFE9E5; --selected:#FFF3C8; --muted:#B8B8B8;
  --zh:"Kaiti SC","STKaiti","KaiTi","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
.big-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:76px;margin-top:16px;border:0;border-radius:22px;
  background:var(--mint-deep);color:var(--white);font:800 28px/1 var(--ui);cursor:pointer;box-shadow:0 6px 0 var(--mint-shadow)}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--mint-shadow)}
.big-btn.coral{background:var(--coral);box-shadow:0 6px 0 var(--coral-shadow)}
.big-btn:disabled{opacity:.5}
.ic{width:36px;height:36px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.note{min-height:24px;margin:8px 0 0;text-align:center;font-size:18px;color:var(--error)}
.link{min-height:64px;min-width:64px;padding:0 14px;border:0;background:transparent;color:var(--ink);font:600 18px var(--ui);opacity:.7;cursor:pointer}
textarea{width:100%;font:22px/1.5 var(--zh);padding:14px;border-radius:18px;border:3px solid var(--mint);background:var(--white);color:var(--ink)}
textarea:focus{outline:none;border-color:var(--mint-deep)}
/* Momo: identical SVG in every file; each mode picks which mouth shows */
.mo-ink{fill:var(--ink)} .mo-eye{fill:var(--white)} .mo-shine{fill:var(--white);opacity:.18} .mo-cheek{fill:var(--coral);opacity:.75}
.mo-line{stroke:var(--white);stroke-width:4;fill:none;stroke-linecap:round}
.momo{width:100%;height:100%;overflow:visible;transform-origin:50% 90%}
.momo .m-o,.momo .m-wavy{opacity:0}
/* ---- Teach Momo ---- */
:root{--listen-ms:900ms;--bounce-ms:700ms}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;align-items:center;min-height:100dvh;overflow-x:hidden}
main{width:100%;max-width:560px;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;flex:1}
h1{font-size:28px;margin:8px 0 4px;text-align:center}
.sub{text-align:center;margin:0 0 14px;font-size:18px;opacity:.8}
.screen{display:none;flex-direction:column;flex:1}
.screen.on{display:flex}
textarea{min-height:220px;resize:vertical}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{background:var(--mint);border-radius:999px;padding:12px 18px;font:800 20px var(--ui)}
.word-box{width:100%}
.word{font:700 190px/1.1 var(--zh);text-align:center;margin:8px 0 0;letter-spacing:.04em;word-break:break-all;line-break:anywhere}
.stage{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:0}
.bubble{position:relative;background:var(--white);border:4px solid var(--ink);border-radius:26px;padding:12px 22px;margin-bottom:18px;
  text-align:center;min-width:150px;max-width:92%;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.bubble.show{opacity:1;transform:scale(1)}
.bubble[hidden]{display:none}
.bubble:after{content:"";position:absolute;left:50%;bottom:-18px;margin-left:-14px;border:14px solid transparent;border-top:18px solid var(--ink);border-bottom:0}
.bubble .zh{font:700 56px/1.1 var(--zh);word-break:break-all;line-break:anywhere}
.bubble .py{font:600 24px/1.2 var(--ui);color:var(--mint-deep);margin-top:4px}
.bubble .say{font:800 30px/1.2 var(--ui)}
.momo-wrap{width:min(200px,24vh);height:min(200px,24vh);position:relative;flex:none}
.momo .m-happy{opacity:0}
.momo-wrap[data-mood="idle"] .m-happy{opacity:1}
.momo-wrap[data-mood="idle"] .momo{animation:breathe 2.6s ease-in-out infinite}
.momo-wrap[data-mood="listen"] .m-o{opacity:1}
.momo-wrap[data-mood="listen"] .momo{animation:lean var(--listen-ms) ease-in-out infinite alternate}
.momo-wrap[data-mood="confused"] .m-wavy{opacity:1}
.momo-wrap[data-mood="confused"] .momo{transform:rotate(-12deg);animation:shake .5s ease-in-out 2}
.momo-wrap[data-mood="confused"] .qmark{opacity:1;animation:pop .35s ease-out}
.momo-wrap[data-mood="gotit"] .m-happy{opacity:1}
.momo-wrap[data-mood="gotit"] .momo{animation:bounce var(--bounce-ms) cubic-bezier(.3,1.8,.5,1) 2}
.momo-wrap[data-mood="gotit"] .spark{opacity:1;animation:spark .8s ease-out}
.qmark{position:absolute;right:-6px;top:-10px;font:900 64px var(--ui);color:var(--coral);opacity:0}
.spark{position:absolute;font-size:34px;opacity:0;color:var(--coral)}
.spark.s1{left:-10px;top:10px}.spark.s2{right:-12px;top:30px}.spark.s3{left:20px;top:-18px}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes lean{to{transform:rotate(8deg) translateY(-4px)}}
@keyframes shake{25%{transform:rotate(-18deg)}75%{transform:rotate(-6deg)}}
@keyframes bounce{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-46px) scale(.94,1.08)}60%{transform:translateY(0) scale(1.12,.88)}100%{transform:translateY(0) scale(1)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes spark{from{transform:scale(.2) translateY(20px)}to{transform:scale(1.2) translateY(-10px)}}
.done-title{font:800 34px/1.2 var(--ui);text-align:center;margin:18px 0 6px}
.learned{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.learned span{background:var(--white);border:3px solid var(--mint);border-radius:16px;padding:8px 14px;font:700 34px var(--zh);max-width:100%;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <!-- Screen 1: teacher pastes the list -->
  <section class="screen on" id="s-paste">
    <h1>Teach Momo</h1>
    <p class="sub">You are the teacher. Momo is the student.</p>
    <textarea id="paste" placeholder="Paste your word list here.&#10;Numbers, pinyin and English are fine. Momo only keeps the Chinese."></textarea>
    <p class="note" id="paste-note"></p>
    <button class="big-btn" id="start" data-icon="play">Start</button>
  </section>

  <!-- Screen 2: one word, one button -->
  <section class="screen" id="s-teach">
    <div class="top">
      <button class="link" id="new-list">New list</button>
      <div class="count" id="count"></div>
    </div>
    <div class="word-box" id="word-box"><div class="word" id="word"></div></div>
    <div class="stage" id="stage">
      <div class="bubble" id="bubble"></div>
      <div class="momo-wrap" id="momo" data-mood="idle">
<!-- MOMO SVG (placeholder art, identical in all three spikes; CSS picks the mouth) -->
<svg class="momo" viewBox="0 0 120 130" role="img" aria-label="Momo, a little ink drop">
  <path class="mo-ink" d="M60 4 C70 26 108 50 108 84 A48 44 0 0 1 12 84 C12 50 50 26 60 4 Z"/>
  <ellipse class="mo-shine" cx="40" cy="62" rx="6" ry="9"/>
  <ellipse class="mo-eye" cx="44" cy="82" rx="9" ry="11"/><ellipse class="mo-eye" cx="76" cy="82" rx="9" ry="11"/>
  <circle class="mo-ink" cx="46" cy="84" r="5"/><circle class="mo-ink" cx="78" cy="84" r="5"/>
  <ellipse class="mo-cheek" cx="32" cy="100" rx="7" ry="4"/><ellipse class="mo-cheek" cx="88" cy="100" rx="7" ry="4"/>
  <path class="m-happy mo-line" d="M50 102 Q60 112 70 102"/>
  <ellipse class="m-o mo-eye" cx="60" cy="106" rx="5" ry="6"/>
  <path class="m-wavy mo-line" d="M48 106 Q53 100 58 106 T68 106 T74 104"/>
</svg>
        <div class="qmark">?</div>
        <div class="spark s1">✦</div><div class="spark s2">✦</div><div class="spark s3">✦</div>
      </div>
    </div>
    <button class="big-btn" id="act"></button>
  </section>

  <!-- Screen 3: all words taught -->
  <section class="screen" id="s-done">
    <div class="done-title" id="done-title"></div>
    <div class="learned" id="learned"></div>
    <button class="big-btn" id="again" data-icon="again">Teach again</button>
    <button class="link" id="new-list-2" style="margin:10px auto 0">New list</button>
  </section>
</main>
<script>
// Tunable settings. Change here, never inside the game logic.
var CONFIG = {
  triesBeforeGotIt: 2,        // "I said it!" taps before Momo gets it (the first one is always confused)
  confusedLines: ["Huh? Say it again!", "Hmm? One more time!", "What? Louder, please!"],
  listenLine: "I'm listening...",
  minWords: 1,
  maxWords: 30,               // longer lists: only the first maxWords are used (teacher is told first)
  maxCharsPerLine: 6,         // longer words wrap onto balanced lines instead of running off screen
  wordMaxPx: 190, bubbleMaxPx: 56,
  bubbleSpacePx: 170,         // room kept above Momo for the speech bubble, so the button never moves off screen
  storageKey: "momo-spike-list"
};
// ---- Shared helpers: MUST stay identical in all three spikes (check.py compares them) ----
var HAN = /[〇㐀-鿿豈-﫿\u{20000}-\u{3134f}]+/u;
var TOKEN = /[〇㐀-鿿豈-﫿\u{20000}-\u{3134f}]+|(?:[A-Za-zÀ-ɏ]+[1-5]?)+/gu;
var TONE = /[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/i;
var NUM_PINYIN = /^(?:[bcdfghjklmnpqrstwxyz]{0,2}[aeiouvü]+(?:ng|n|r)?[1-5])+$/i;
function isPinyin(t){ return TONE.test(t) || NUM_PINYIN.test(t); }
function parseList(text){
  var out = [], byWord = {};
  String(text).normalize("NFC").split(/\r?\n/).forEach(function(line){
    line = line.replace(/^\s*[\(（\[]?\s*[0-9０-９]+\s*[\.\)、．:：）\]-]?\s*/, "");
    // Pair each Chinese word with the pinyin that follows it BEFORE looking at separators,
    // so tab columns (Sheets, Excel), CSV and "苹果/píngguǒ" all keep their pinyin.
    // Lines that start with pinyin ("píngguǒ 苹果 xiāngjiāo 香蕉") give each word the pinyin BEFORE it; otherwise the pinyin after it.
    var toks = line.match(TOKEN) || [], before = toks.length && !HAN.test(toks[0]) && isPinyin(toks[0]);
    var items = [], pending = [];
    toks.forEach(function(t){
      if (HAN.test(t)){ items.push({ zh: t, py: before ? pending : [] }); pending = []; }
      else if (isPinyin(t)){ if (before || !items.length) pending.push(t); else items[items.length - 1].py.push(t); }
    });
    if (pending.length && items.length && !items[items.length - 1].py.length) items[items.length - 1].py = pending;
    var last = items[items.length - 1], tail = last ? last.py.slice() : [];
    if (items.length > 1 && tail.length === items.length &&
        items.slice(0, -1).every(function(w){ return !w.py.length; })){                   // "苹果 香蕉 píngguǒ xiāngjiāo"
      items.forEach(function(w, i){ w.py = [tail[i]]; });
    }
    items.forEach(function(w){
      var py = w.py.join(" ");
      if (byWord[w.zh]){ if (!byWord[w.zh].py && py) byWord[w.zh].py = py; return; }
      byWord[w.zh] = { zh: w.zh, py: py }; out.push(byWord[w.zh]);
    });
  });
  return out;
}
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function plural(n, one, many){ return n + " " + (n === 1 ? one : many); }
function charCount(s){ return Array.from(s).length; }
// Biggest font size that fits a word inside a box by BOTH width and height. Tries every line count
// (at most maxPerLine characters a line) and caps the element width so the lines come out even.
function fitWord(text, boxW, boxH, maxPx, maxPerLine){
  var n = Math.max(1, charCount(text)), best = { px: 0, per: n };
  for (var lines = Math.ceil(n / maxPerLine); lines <= n; lines++){
    var per = Math.ceil(n / lines), rows = Math.ceil(n / per);
    var px = Math.floor(Math.min(maxPx, boxW / (per * 1.12), boxH / (rows * 1.2)));
    if (px > best.px) best = { px: px, per: per };
  }
  best.px = Math.max(14, best.px);
  return best;
}
function applyFit(el, text, boxW, boxH, maxPx, maxPerLine){
  var f = fitWord(text, boxW, boxH, maxPx, maxPerLine);
  el.style.fontSize = f.px + "px";
  el.style.maxWidth = Math.ceil(f.px * f.per * 1.1) + "px";   // wraps after f.per characters
  el.style.marginLeft = el.style.marginRight = "auto";
}
var ICON = {
  play:    '<path d="M7 4l13 8-13 8z" fill="currentColor"/>',
  ear:     '<path d="M7 10a5 5 0 1 1 10 0c0 3.5-3.5 4.5-3.5 7.5a3 3 0 0 1-5.5 1.6"/><path d="M10 10a2 2 0 1 1 4 0"/>',
  mouth:   '<path d="M3 11c3-3 6-3 9-1 3-2 6-2 9 1-2 5.5-5 7.5-9 7.5S5 16.5 3 11z"/><path d="M3 11c5 2.5 13 2.5 18 0"/>',
  arrow:   '<path d="M4 12h15M13 6l6 6-6 6"/>',
  star:    '<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.3L12 17.5l-5.5 2.9 1-6.3L3 9.7l6.2-.9z"/>',
  eye:     '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  again:   '<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/>',
  shuffle: '<path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/>',
  print:   '<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2"/><path d="M7 14h10v7H7z"/>'
};
function setBtn(b, icon, label){
  b.innerHTML = (ICON[icon] ? '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + ICON[icon] + "</svg>" : "") + "<span>" + esc(label) + "</span>";
}
document.querySelectorAll("[data-icon]").forEach(function(b){ setBtn(b, b.dataset.icon, b.textContent.trim()); });
// ---- end shared helpers ----
// ---- Game ----
var $ = function(id){ return document.getElementById(id); };
var words = [], idx = 0, tries = 0, learned = 0, phase = "idle", longOk = false;
function show(id){ document.querySelectorAll(".screen").forEach(function(s){ s.classList.toggle("on", s.id === id); }); }
function mood(m){ var el = $("momo"); el.dataset.mood = "idle"; void el.offsetWidth; el.dataset.mood = m; }
function bubble(html){
  var b = $("bubble"); b.classList.remove("show");
  if (!html){ b.innerHTML = ""; b.hidden = true; return; }          // a faded bubble takes no space
  b.hidden = false; b.innerHTML = html; void b.offsetWidth; b.classList.add("show");
}
function setCount(){ $("count").textContent = "Momo learned " + plural(learned, "word", "words"); }
// Height left for the big word: the screen minus everything below it (bubble room, Momo, button, padding).
function wordHeight(){
  var main = getComputedStyle(document.querySelector("main"));
  var below = CONFIG.bubbleSpacePx + $("momo").offsetHeight + $("act").offsetHeight + 16 + parseFloat(main.paddingBottom) + 8;
  return window.innerHeight - $("word-box").getBoundingClientRect().top - below;
}
function fitMain(){ if (words[idx]) applyFit($("word"), words[idx].zh, $("word-box").clientWidth, wordHeight(), CONFIG.wordMaxPx, CONFIG.maxCharsPerLine); }
function act(icon, label, coral){ setBtn($("act"), icon, label); $("act").classList.toggle("coral", !!coral); }

function loadWord(){
  var w = words[idx]; tries = 0; phase = "idle";
  $("word").textContent = w.zh;
  mood("idle"); bubble(""); act("ear", "Teach Momo"); fitMain();
}
$("paste").oninput = function(){ longOk = false; $("paste-note").textContent = ""; };
$("start").onclick = function(){
  var text = $("paste").value, list = parseList(text);
  if (!list.length){ $("paste-note").textContent = "No Chinese words found. Paste a list with Chinese in it."; return; }
  if (list.length < CONFIG.minWords){ $("paste-note").textContent = "Add at least " + plural(CONFIG.minWords, "word", "words") + "."; return; }
  if (list.length > CONFIG.maxWords && !longOk){
    longOk = true; $("paste-note").textContent = "That is a long list. Momo will learn the first " + CONFIG.maxWords + " words. Tap Start again to go."; return;
  }
  words = list.slice(0, CONFIG.maxWords);
  $("paste-note").textContent = ""; store(CONFIG.storageKey, text);
  idx = 0; learned = 0; setCount(); show("s-teach"); loadWord();
};
$("act").onclick = function(){
  var w = words[idx];
  if (phase === "idle"){            // kid gets ready to teach
    phase = "listen"; mood("listen"); bubble('<div class="say">' + esc(CONFIG.listenLine) + '</div>');
    act("mouth", "I said it!", true); return;
  }
  if (phase === "listen"){          // kid said the word out loud
    tries++;
    if (tries < CONFIG.triesBeforeGotIt){
      mood("confused"); bubble('<div class="say">' + esc(CONFIG.confusedLines[(idx + tries) % CONFIG.confusedLines.length]) + '</div>');
      return;
    }
    phase = "gotit"; learned++; setCount(); mood("gotit");
    bubble('<div class="zh">' + esc(w.zh) + '</div>' + (w.py ? '<div class="py">' + esc(w.py) + '</div>' : ""));
    var zhH = CONFIG.bubbleSpacePx - 18 - 32 - (w.py ? 34 : 0);    // bubble room minus tail, padding, border and pinyin line
    applyFit($("bubble").querySelector(".zh"), w.zh, $("stage").clientWidth * 0.92 - 52, zhH, CONFIG.bubbleMaxPx, CONFIG.maxCharsPerLine);
    if (idx + 1 < words.length) act("arrow", "Next word"); else act("star", "Finish");
    return;
  }
  if (phase === "gotit"){
    idx++;
    if (idx < words.length) return loadWord();
    $("done-title").textContent = learned === 1 ? "Momo learned the word!" : "Momo learned all " + learned + " words!";
    $("learned").innerHTML = words.map(function(w){ return "<span>" + esc(w.zh) + "</span>"; }).join("");
    show("s-done");
  }
};
$("again").onclick = function(){ idx = 0; learned = 0; setCount(); show("s-teach"); loadWord(); };
$("new-list").onclick = $("new-list-2").onclick = function(){ show("s-paste"); };
window.addEventListener("resize", fitMain);
var saved = store(CONFIG.storageKey); if (saved) $("paste").value = saved;
</script>
</body>
</html>
