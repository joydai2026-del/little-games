<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teach Momo</title>
<style>
:root{
  --cream:#FFF7E8; --mint:#BFE8D8; --mint-deep:#3FA88A; --coral:#FF7B6B; --ink:#2D3436;
  --zh:"Kaiti SC","STKaiti","KaiTi","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;
}
/* Tunable timings (ms). Change here, not in the logic. */
:root{--listen-ms:900ms;--bounce-ms:700ms}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;align-items:center;min-height:100dvh}
main{width:100%;max-width:560px;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;flex:1}
h1{font-size:28px;margin:8px 0 4px;text-align:center}
.sub{text-align:center;margin:0 0 14px;font-size:18px;opacity:.8}
.screen{display:none;flex-direction:column;flex:1}
.screen.on{display:flex}
textarea{width:100%;min-height:220px;font:22px/1.5 var(--zh);padding:14px;border-radius:18px;border:3px solid var(--mint);
  background:#fff;color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--mint-deep)}
.big-btn{display:block;width:100%;min-height:76px;margin-top:16px;border:0;border-radius:22px;background:var(--mint-deep);color:#fff;
  font:800 28px/1 var(--ui);cursor:pointer;box-shadow:0 6px 0 #2c7a64;transition:transform .08s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2c7a64}
.big-btn.coral{background:var(--coral);box-shadow:0 6px 0 #c95a4c}
.note{min-height:26px;margin:10px 0 0;text-align:center;font-size:18px;color:#b3473a}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{min-height:64px;min-width:64px;padding:0 14px;border:0;background:transparent;color:var(--ink);font:600 18px var(--ui);opacity:.7;cursor:pointer}
.count{background:var(--mint);border-radius:999px;padding:12px 18px;font:800 20px var(--ui)}
.word{font:700 min(34vw,190px)/1.05 var(--zh);text-align:center;margin:8px 0 0;letter-spacing:.04em;word-break:keep-all}
.word.long{font-size:min(22vw,130px)}
.stage{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:280px}
.bubble{position:relative;background:#fff;border:4px solid var(--ink);border-radius:26px;padding:12px 22px;margin-bottom:18px;
  text-align:center;min-width:150px;max-width:92%;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.bubble.show{opacity:1;transform:scale(1)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-18px;margin-left:-14px;border:14px solid transparent;border-top:18px solid var(--ink);border-bottom:0}
.bubble .zh{font:700 56px/1.1 var(--zh)}
.bubble .py{font:600 24px/1.2 var(--ui);color:var(--mint-deep);margin-top:4px}
.bubble .say{font:800 30px/1.2 var(--ui)}
/* Momo */
.momo-wrap{width:200px;height:200px;position:relative}
.momo{width:100%;height:100%;overflow:visible;transform-origin:50% 90%}
.momo .m-happy,.momo .m-o,.momo .m-wavy{opacity:0}
.momo-wrap[data-mood="idle"] .m-happy{opacity:1}
.momo-wrap[data-mood="idle"] .momo{animation:breathe 2.6s ease-in-out infinite}
.momo-wrap[data-mood="listen"] .m-o{opacity:1}
.momo-wrap[data-mood="listen"] .momo{animation:lean var(--listen-ms) ease-in-out infinite alternate}
.momo-wrap[data-mood="confused"] .m-wavy{opacity:1}
.momo-wrap[data-mood="confused"] .momo{transform:rotate(-12deg);animation:shake .5s ease-in-out 2}
.momo-wrap[data-mood="confused"] .qmark{opacity:1;animation:pop .35s ease-out}
.momo-wrap[data-mood="gotit"] .m-happy{opacity:1}
.momo-wrap[data-mood="gotit"] .momo{animation:bounce var(--bounce-ms) cubic-bezier(.3,1.8,.5,1) 2}
.momo-wrap[data-mood="gotit"] .spark{opacity:1;animation:spark .8s ease-out}
.qmark{position:absolute;right:-6px;top:-10px;font:900 64px var(--ui);color:var(--coral);opacity:0}
.spark{position:absolute;font-size:34px;opacity:0;color:var(--coral)}
.spark.s1{left:-10px;top:10px}.spark.s2{right:-12px;top:30px}.spark.s3{left:20px;top:-18px}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes lean{to{transform:rotate(8deg) translateY(-4px)}}
@keyframes shake{25%{transform:rotate(-18deg)}75%{transform:rotate(-6deg)}}
@keyframes bounce{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-46px) scale(.94,1.08)}60%{transform:translateY(0) scale(1.12,.88)}100%{transform:translateY(0) scale(1)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes spark{from{transform:scale(.2) translateY(20px)}to{transform:scale(1.2) translateY(-10px)}}
.done-title{font:800 34px/1.2 var(--ui);text-align:center;margin:18px 0 6px}
.learned{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.learned span{background:#fff;border:3px solid var(--mint);border-radius:16px;padding:8px 14px;font:700 34px var(--zh)}
.placeholder-note{font-size:13px;opacity:.55;text-align:center;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <!-- Screen 1: teacher pastes the list -->
  <section class="screen on" id="s-paste">
    <h1>Teach Momo</h1>
    <p class="sub">You are the teacher. Momo is the student.</p>
    <textarea id="paste" placeholder="Paste your word list here.&#10;Numbers, pinyin and English are fine. Momo only keeps the Chinese."></textarea>
    <p class="note" id="paste-note"></p>
    <button class="big-btn" id="start">Start</button>
    <p class="placeholder-note">Momo drawing is a placeholder.</p>
  </section>

  <!-- Screen 2: one word, one button -->
  <section class="screen" id="s-teach">
    <div class="top">
      <button class="link" id="new-list">New list</button>
      <div class="count" id="count">Momo learned 0 words</div>
    </div>
    <div class="word" id="word"></div>
    <div class="stage">
      <div class="bubble" id="bubble"></div>
      <div class="momo-wrap" id="momo" data-mood="idle">
        <!-- MOMO SVG (placeholder, identical in all three spikes) -->
        <svg class="momo" viewBox="0 0 120 130" role="img" aria-label="Momo, a little ink drop">
          <path d="M60 4 C70 26 108 50 108 84 A48 44 0 0 1 12 84 C12 50 50 26 60 4 Z" fill="#2D3436"/>
          <ellipse cx="40" cy="62" rx="6" ry="9" fill="#fff" opacity=".18"/>
          <ellipse cx="44" cy="82" rx="9" ry="11" fill="#fff"/><ellipse cx="76" cy="82" rx="9" ry="11" fill="#fff"/>
          <circle cx="46" cy="84" r="5" fill="#2D3436"/><circle cx="78" cy="84" r="5" fill="#2D3436"/>
          <ellipse cx="32" cy="100" rx="7" ry="4" fill="#FF7B6B" opacity=".75"/><ellipse cx="88" cy="100" rx="7" ry="4" fill="#FF7B6B" opacity=".75"/>
          <path class="m-happy" d="M50 102 Q60 112 70 102" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
          <ellipse class="m-o" cx="60" cy="106" rx="5" ry="6" fill="#fff"/>
          <path class="m-wavy" d="M48 106 Q53 100 58 106 T68 106 T74 104" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="qmark">?</div>
        <div class="spark s1">✦</div><div class="spark s2">✦</div><div class="spark s3">✦</div>
      </div>
    </div>
    <button class="big-btn" id="act">Teach Momo</button>
  </section>

  <!-- Screen 3: all words taught -->
  <section class="screen" id="s-done">
    <div class="done-title" id="done-title"></div>
    <div class="learned" id="learned"></div>
    <button class="big-btn" id="again">Teach again</button>
    <button class="link" id="new-list-2" style="margin:10px auto 0">New list</button>
  </section>
</main>
<script>
// Tunable settings. Change here, never inside the game logic.
var CONFIG = {
  triesBeforeGotIt: 2,        // how many "I said it!" taps before Momo gets it (first one = confused)
  confusedLines: ["Huh? Say it again!", "Hmm? One more time!", "What? Louder, please!"],
  listenLine: "I'm listening...",
  storageKey: "momo-spike-list"
};

// ---- Paste parser (same in all three spikes) ----
var CJK = /[㐀-鿿豈-﫿]+/g;
var TONE = /[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/i;
function parseList(text){
  var out = [], seen = {};
  text.split(/\r?\n/).forEach(function(line){
    line = line.replace(/^\s*[\(（\[]?\s*\d+\s*[\.\)、．:：）\]-]?\s*/, "");
    line.split(/[,，、;；\/|\t]+/).forEach(function(seg){
      var zh = seg.match(CJK) || [];
      var py = (seg.match(/[A-Za-zÀ-ɏ]+[1-5]?/g) || []).filter(function(t){ return TONE.test(t) || /[a-z][1-5]$/i.test(t); });
      zh.forEach(function(w, i){
        if (seen[w]) return; seen[w] = 1;
        var p = zh.length === 1 ? py.join(" ") : (py.length === zh.length ? py[i] : "");
        out.push({ zh: w, py: p });
      });
    });
  });
  return out;
}
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

// ---- Game ----
var $ = function(id){ return document.getElementById(id); };
var words = [], idx = 0, tries = 0, learned = 0, phase = "idle";
function show(id){ document.querySelectorAll(".screen").forEach(function(s){ s.classList.toggle("on", s.id === id); }); }
function mood(m){ var el = $("momo"); el.dataset.mood = "idle"; void el.offsetWidth; el.dataset.mood = m; }
function bubble(html){ var b = $("bubble"); b.classList.remove("show"); if (!html) return; b.innerHTML = html; void b.offsetWidth; b.classList.add("show"); }
function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function setCount(){ $("count").textContent = "Momo learned " + learned + (learned === 1 ? " word" : " words"); }

function loadWord(){
  var w = words[idx]; tries = 0; phase = "idle";
  $("word").textContent = w.zh; $("word").classList.toggle("long", w.zh.length > 2);
  mood("idle"); bubble(""); $("act").textContent = "Teach Momo"; $("act").classList.remove("coral");
}
$("start").onclick = function(){
  var text = $("paste").value; words = parseList(text);
  if (!words.length){ $("paste-note").textContent = "No Chinese words found. Paste a list with Chinese in it."; return; }
  $("paste-note").textContent = ""; store(CONFIG.storageKey, text);
  idx = 0; learned = 0; setCount(); show("s-teach"); loadWord();
};
$("act").onclick = function(){
  var w = words[idx];
  if (phase === "idle"){            // kid gets ready to teach
    phase = "listen"; mood("listen"); bubble('<div class="say">' + CONFIG.listenLine + '</div>');
    $("act").textContent = "I said it!"; $("act").classList.add("coral"); return;
  }
  if (phase === "listen"){          // kid said the word out loud
    tries++;
    if (tries < CONFIG.triesBeforeGotIt){
      mood("confused"); bubble('<div class="say">' + CONFIG.confusedLines[(idx + tries) % CONFIG.confusedLines.length] + '</div>');
      return;
    }
    phase = "gotit"; learned++; setCount(); mood("gotit");
    bubble('<div class="zh">' + esc(w.zh) + '</div>' + (w.py ? '<div class="py">' + esc(w.py) + '</div>' : ""));
    $("act").textContent = idx + 1 < words.length ? "Next word" : "Finish"; $("act").classList.remove("coral"); return;
  }
  if (phase === "gotit"){
    idx++;
    if (idx < words.length) return loadWord();
    $("done-title").textContent = "Momo learned all " + learned + " words!";
    $("learned").innerHTML = words.map(function(w){ return "<span>" + esc(w.zh) + "</span>"; }).join("");
    show("s-done");
  }
};
$("again").onclick = function(){ idx = 0; learned = 0; setCount(); show("s-teach"); loadWord(); };
$("new-list").onclick = $("new-list-2").onclick = function(){ show("s-paste"); };
var saved = store(CONFIG.storageKey); if (saved) $("paste").value = saved;
</script>
</body>
</html>
