<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fredoka;src:url('file:///usr/share/fonts/truetype/sand-box/google/Fredoka/Fredoka-VariableFont_wdth,wght.ttf');}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1000px;height:1500px;background:{{bg}};font-family:Fredoka,"Noto Sans CJK SC",sans-serif;color:#42291D;overflow:hidden;position:relative}
.top{padding:64px 70px 0}
.kick{display:inline-block;background:#FFFCF6;border:4px solid #42291D;border-radius:999px;padding:10px 28px;font-size:34px;font-weight:600}
h1{font-size:84px;line-height:1.02;font-weight:700;margin-top:30px;letter-spacing:-1px}
.zh{font-family:"Noto Sans CJK SC";font-weight:700;font-size:60px;color:{{accent}};margin-top:14px}
.card{position:absolute;left:110px;top:560px;width:780px;height:780px;background:#FFFCF6;border:5px solid #42291D;border-radius:36px;padding:22px;transform:rotate(-1.5deg);box-shadow:0 26px 0 -6px rgba(66,41,29,.25)}
.card img{width:100%;height:100%;object-fit:cover;border-radius:22px}
.price{position:absolute;right:52px;top:500px;background:{{accent}};color:#FFFCF6;font-size:52px;font-weight:700;padding:22px 34px;border-radius:30px;transform:rotate(5deg);border:5px solid #42291D;z-index:3}
.sub{position:absolute;left:70px;right:70px;bottom:62px;font-size:38px;line-height:1.2;font-weight:500;text-align:center}
.brand{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:24px;font-weight:600;opacity:.75}
</style></head><body>
<div class="top"><span class="kick">{{kicker}}</span><h1>{{title}}</h1><div class="zh">{{zh}} · K-5</div></div>
<div class="price">{{price}}</div>
<div class="card"><img src="{{img}}"></div>
<div class="sub">{{sub}}</div>
<div class="brand">Avery Studio on TPT · averystudio.org</div>
</body></html>
